 if(editId)Object.assign(gs(editId),o);else{const z=newS(o);S.siswa.push(z);sel=z.id}editId=null;save();render()}

 rows.forEach(o=>{if(o.Nama)S.siswa.push(newS({nisn:String(o.NISN||''),nama:String(o.Nama),kelas:String(o.Kelas||''),jk:String(o.Gender||'L').toUpperCase().startsWith('P')?'P':'L',wali:String(o['Wali Kelas']||'')}))});
 syncKelas();save();render();alert(rows.length+' baris diimpor.')}catch(er){alert('File tidak dapat dibaca.')}};r.readAsArrayBuffer(f)}

 const R=[["Satuan Pendidikan",S.sch.nama],["Semester / Tahun Ajaran",S.sch.smt+" / "+S.sch.ta],["Komponen Layanan",j.jenis],["Sasaran Layanan",s.nama?s.nama+" (Kelas "+s.kelas+")":(j.kls?"Seluruh siswa kelas "+j.kls:'-')],["Tanggal Pelaksanaan",tgl(j.tgl)],["Topik / Permasalahan",j.topik],["Tujuan Layanan","Peserta didik memahami permasalahannya dan mampu mengambil langkah penyelesaian secara mandiri dan bertanggung jawab."],["Kegiatan","1) Pembukaan dan membangun hubungan; 2) Eksplorasi masalah; 3) Pembahasan alternatif solusi; 4) Kesepakatan tindakan; 5) Penutup."],["Tindak Lanjut",j.tl],["Evaluasi","Proses: keaktifan dan keterbukaan siswa. Hasil: pemahaman dan komitmen tindakan. Jangka panjang: perubahan perilaku."],["Status",j.status]];

 return `<h1 class="text-xl font-bold mb-3">Asesmen Siswa</h1><div class="mb-3">${selS('render()')}</div>
